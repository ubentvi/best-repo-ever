<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse Salesforce files linked to a record." />
    <title>Record Files</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Salesforce file browser</p>
        <h1>Open the files linked to a record.</h1>
        <p class="lede">Enter a Salesforce record ID to find its documents and open them in separate browser tabs.</p>
      </header>

      <form id="record-form" class="search-form">
        <label for="record-id">Record ID</label>
        <div class="search-row">
          <input id="record-id" name="recordId" autocomplete="off" placeholder="001000000000000AAA" required />
          <button type="submit">Find documents</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="results" aria-labelledby="results-heading" hidden>
        <div class="section-heading">
          <h2 id="results-heading">Documents</h2>
          <span id="count" class="count"></span>
        </div>
        <ul id="document-list" class="document-list"></ul>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
